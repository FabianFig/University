<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Smart Task Tracker</title>
  <style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 700px;
    margin: 2rem auto;
    padding: 0 1rem;
    background: #f7f7f8;
    color: #1a1a1a;
  }

  h1 {
    font-size: 1.5rem;
    margin-bottom: 1rem;
  }

  h2 {
    font-size: 1.25rem;
    margin-bottom: 1rem;
  }

  /* filter and nav links */
  nav {
    margin-bottom: 1rem;
  }

  a {
    color: #2563eb;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  .filters a {
    margin-right: 0.5rem;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    background: #e5e7eb;
    color: #374151;
    font-size: 0.85rem;
  }

  .filters a:hover {
    background: #d1d5db;
    text-decoration: none;
  }

  .new-task-btn {
    display: inline-block;
    margin: 0.75rem 0 1rem;
    padding: 0.5rem 1rem;
    background: #2563eb;
    color: white;
    border-radius: 6px;
    font-size: 0.9rem;
  }

  .new-task-btn:hover {
    background: #1d4ed8;
    text-decoration: none;
  }

  /* task cards */
  .task {
    background: white;
    border: 1px solid #e5e7eb;
    padding: 1rem;
    margin-bottom: 0.75rem;
    border-radius: 8px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }

  .task strong {
    font-size: 1.05rem;
  }

  .task-desc {
    color: #4b5563;
    margin: 0.35rem 0;
  }

  .task-meta {
    font-size: 0.85rem;
    color: #6b7280;
    margin-bottom: 0.5rem;
  }

  .status {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .status-to-do {
    background: #fee2e2;
    color: #991b1b;
  }

  .status-in-progress {
    background: #fef3c7;
    color: #92400e;
  }

  .status-done {
    background: #d1fae5;
    color: #065f46;
  }

  .task-actions form {
    display: inline;
  }

  .task-actions a,
  .task-actions button {
    font-size: 0.85rem;
    margin-right: 0.5rem;
  }

  .task-actions button {
    background: none;
    border: none;
    color: #dc2626;
    cursor: pointer;
    padding: 0;
    font-family: inherit;
  }

  .task-actions button:hover {
    text-decoration: underline;
  }

  /* forms */
  form label {
    display: block;
    margin-bottom: 1rem;
    font-size: 0.9rem;
    font-weight: 500;
  }

  input,
  textarea,
  select {
    width: 100%;
    padding: 0.5rem;
    margin-top: 0.3rem;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.95rem;
  }

  textarea {
    min-height: 80px;
    resize: vertical;
  }

  button[type="submit"] {
    background: #2563eb;
    color: white;
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
  }

  button[type="submit"]:hover {
    background: #1d4ed8;
  }

  /* messages */
  ul {
    list-style: none;
    padding: 0;
  }

  ul li {
    background: #fef9c3;
    border: 1px solid #fde68a;
    padding: 0.6rem 0.9rem;
    border-radius: 6px;
    margin-bottom: 0.75rem;
    font-size: 0.9rem;
  }

  hr {
    border: none;
    border-top: 1px solid #e5e7eb;
    margin: 1rem 0;
  }
</style>
</head>
<body>
  <h1>Smart Task Tracker</h1>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul>
        {% for m in messages %}
          <li>{{ m }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
